<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07080B" />
      <stop offset="100%" stop-color="#14151C" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad)" rx="16" />

  <!-- E-Commerce Layout -->
  <g transform="translate(100, 75)">
    <!-- Header Navigation -->
    <rect width="1000" height="60" fill="#11131A" rx="8" />
    <text x="40" y="36" fill="#F8FAFC" font-family="sans-serif" font-size="20" font-weight="800" letter-spacing="3">VELOCE</text>
    <text x="350" y="36" fill="#94A3B8" font-family="sans-serif" font-size="14">Shop</text>
    <text x="420" y="36" fill="#94A3B8" font-family="sans-serif" font-size="14">Collections</text>
    <text x="530" y="36" fill="#94A3B8" font-family="sans-serif" font-size="14">Editorial</text>
    <rect x="860" y="16" width="100" height="28" rx="14" fill="#00F0FF" opacity="0.9" />
    <text x="910" y="35" fill="#090A0F" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Cart (3)</text>

    <!-- Hero Product Left -->
    <g transform="translate(0, 90)">
      <rect width="480" height="450" rx="12" fill="#181A24" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <!-- Product Graphic -->
      <circle cx="240" cy="210" r="120" fill="none" stroke="#00F0FF" stroke-width="3" stroke-dasharray="8 8" />
      <circle cx="240" cy="210" r="80" fill="#222634" />
      <text x="240" y="218" fill="#F8FAFC" font-family="monospace" font-size="24" font-weight="700" text-anchor="middle">MOD-01</text>
      <text x="40" y="410" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="600">Minimalist Audio Unit</text>
      <text x="400" y="410" fill="#00F0FF" font-family="sans-serif" font-size="18" font-weight="700">$349</text>
    </g>

    <!-- Product Right Grid -->
    <g transform="translate(510, 90)">
      <!-- Item 1 -->
      <rect width="490" height="215" rx="12" fill="#181A24" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <rect x="20" y="20" width="175" height="175" rx="8" fill="#222634" />
      <text x="220" y="60" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="600">Carbon Chrono Watch</text>
      <text x="220" y="90" fill="#94A3B8" font-family="sans-serif" font-size="13">Matte finish with sapphire glass</text>
      <text x="220" y="160" fill="#10B981" font-family="sans-serif" font-size="16" font-weight="700">$590</text>

      <!-- Item 2 -->
      <rect y="235" width="490" height="215" rx="12" fill="#181A24" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <rect x="20" y="255" width="175" height="175" rx="8" fill="#222634" />
      <text x="220" y="295" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="600">Titanium Desk Pad</text>
      <text x="220" y="325" fill="#94A3B8" font-family="sans-serif" font-size="13">Laser-etched precision grid</text>
      <text x="220" y="395" fill="#10B981" font-family="sans-serif" font-size="16" font-weight="700">$180</text>
    </g>
  </g>
</svg>
