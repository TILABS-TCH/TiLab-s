<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="100%" stop-color="#10121A" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad)" rx="16" />

  <!-- Zenith OS Desktop Mockup -->
  <g transform="translate(100, 60)">
    <!-- Main Window 1 -->
    <rect width="600" height="420" rx="10" fill="#141724" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <!-- Header -->
    <rect width="600" height="36" fill="#1A1E2E" rx="10" />
    <circle cx="20" cy="18" r="5" fill="#EF4444" />
    <circle cx="36" cy="18" r="5" fill="#F59E0B" />
    <circle cx="52" cy="18" r="5" fill="#10B981" />
    <text x="300" y="23" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Terminal - zenith-sh v1.4</text>
    <!-- Code Lines -->
    <text x="30" y="75" fill="#00F0FF" font-family="monospace" font-size="13">user@zenith-os ~ % ./launch_experience.sh</text>
    <text x="30" y="105" fill="#10B981" font-family="monospace" font-size="13">[INFO] Initializing window compositor... OK</text>
    <text x="30" y="135" fill="#10B981" font-family="monospace" font-size="13">[INFO] Loading Framer Motion spring physics... OK</text>
    <text x="30" y="165" fill="#94A3B8" font-family="monospace" font-size="13">[DEBUG] Memory footprint: 14.2 MB</text>
    <text x="30" y="195" fill="#F8FAFC" font-family="monospace" font-size="13">user@zenith-os ~ % _</text>

    <!-- Overlay Window 2 -->
    <g transform="translate(350, 180)">
      <rect width="550" height="380" rx="10" fill="#191D2D" stroke="#00F0FF" stroke-width="1.5" />
      <rect width="550" height="36" fill="#202538" rx="10" />
      <circle cx="20" cy="18" r="5" fill="#EF4444" />
      <circle cx="36" cy="18" r="5" fill="#F59E0B" />
      <circle cx="52" cy="18" r="5" fill="#10B981" />
      <text x="275" y="23" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Audio Visualizer Sandbox</text>
      <!-- Bars -->
      <g transform="translate(40, 100)">
        <rect x="0" y="40" width="25" height="140" rx="4" fill="#00F0FF" />
        <rect x="40" y="20" width="25" height="160" rx="4" fill="#3B82F6" />
        <rect x="80" y="70" width="25" height="110" rx="4" fill="#10B981" />
        <rect x="120" y="10" width="25" height="170" rx="4" fill="#00F0FF" />
        <rect x="160" y="50" width="25" height="130" rx="4" fill="#F59E0B" />
        <rect x="200" y="30" width="25" height="150" rx="4" fill="#3B82F6" />
        <rect x="240" y="80" width="25" height="100" rx="4" fill="#10B981" />
        <rect x="280" y="60" width="25" height="120" rx="4" fill="#00F0FF" />
        <rect x="320" y="20" width="25" height="160" rx="4" fill="#3B82F6" />
        <rect x="360" y="90" width="25" height="90" rx="4" fill="#10B981" />
        <rect x="400" y="40" width="25" height="140" rx="4" fill="#00F0FF" />
        <rect x="440" y="10" width="25" height="170" rx="4" fill="#F59E0B" />
      </g>
    </g>

    <!-- Taskbar Dock at Bottom -->
    <rect x="250" y="590" width="500" height="50" rx="25" fill="#181B28" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <circle cx="330" cy="615" r="16" fill="#00F0FF" />
    <circle cx="390" cy="615" r="16" fill="#3B82F6" />
    <circle cx="450" cy="615" r="16" fill="#10B981" />
    <circle cx="510" cy="615" r="16" fill="#F59E0B" />
    <circle cx="570" cy="615" r="16" fill="#EC4899" />
    <circle cx="630" cy="615" r="16" fill="#8B5CF6" />
    <circle cx="670" cy="615" r="16" fill="rgba(255,255,255,0.1)" />
  </g>
</svg>
