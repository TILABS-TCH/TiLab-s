<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080A0E" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad)" rx="16" />

  <!-- Pulse Analytics Dashboard -->
  <g transform="translate(100, 75)">
    <!-- Header -->
    <rect width="1000" height="50" rx="8" fill="#141926" />
    <text x="30" y="32" fill="#00F0FF" font-family="monospace" font-size="16" font-weight="700">PULSE // SYSTEM TELEMETRY</text>
    <circle cx="940" cy="25" r="6" fill="#10B981" />
    <text x="910" y="30" fill="#10B981" font-family="monospace" font-size="12" text-anchor="end">LIVE STREAMING</text>

    <!-- Grid of Metric Widgets -->
    <g transform="translate(0, 70)">
      <!-- Widget 1: CPU / Memory -->
      <rect width="310" height="230" rx="10" fill="#141926" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="24" y="36" fill="#94A3B8" font-family="sans-serif" font-size="13">API Server Load</text>
      <text x="24" y="75" fill="#F8FAFC" font-family="sans-serif" font-size="32" font-weight="700">32.4 %</text>
      <!-- Bars -->
      <rect x="24" y="110" width="260" height="12" rx="6" fill="rgba(255,255,255,0.06)" />
      <rect x="24" y="110" width="160" height="12" rx="6" fill="#00F0FF" />

      <!-- Widget 2: Latency -->
      <rect x="345" width="310" height="230" rx="10" fill="#141926" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="369" y="36" fill="#94A3B8" font-family="sans-serif" font-size="13">Global Edge Latency</text>
      <text x="369" y="75" fill="#10B981" font-family="sans-serif" font-size="32" font-weight="700">18 ms</text>
      <path d="M 369 170 Q 445 120, 520 150 T 630 110" fill="none" stroke="#10B981" stroke-width="3" />

      <!-- Widget 3: Active Requests -->
      <rect x="690" width="310" height="230" rx="10" fill="#141926" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="714" y="36" fill="#94A3B8" font-family="sans-serif" font-size="13">Concurrent Sessions</text>
      <text x="714" y="75" fill="#3B82F6" font-family="sans-serif" font-size="32" font-weight="700">14,290</text>
    </g>

    <!-- Lower Table Area -->
    <g transform="translate(0, 320)">
      <rect width="1000" height="230" rx="10" fill="#141926" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="30" y="36" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600">Endpoint Performance Log</text>

      <!-- Row 1 -->
      <rect x="30" y="60" width="940" height="40" rx="6" fill="#1B2130" />
      <text x="50" y="85" fill="#00F0FF" font-family="monospace" font-size="13">GET /api/v2/user/auth</text>
      <text x="450" y="85" fill="#10B981" font-family="monospace" font-size="13">200 OK</text>
      <text x="880" y="85" fill="#94A3B8" font-family="monospace" font-size="13">12ms</text>

      <!-- Row 2 -->
      <rect x="30" y="110" width="940" height="40" rx="6" fill="#1B2130" />
      <text x="50" y="135" fill="#00F0FF" font-family="monospace" font-size="13">POST /api/v2/telemetry/event</text>
      <text x="450" y="135" fill="#10B981" font-family="monospace" font-size="13">201 Created</text>
      <text x="880" y="135" fill="#94A3B8" font-family="monospace" font-size="13">24ms</text>

      <!-- Row 3 -->
      <rect x="30" y="160" width="940" height="40" rx="6" fill="#1B2130" />
      <text x="50" y="185" fill="#00F0FF" font-family="monospace" font-size="13">GET /api/v2/analytics/stream</text>
      <text x="450" y="185" fill="#10B981" font-family="monospace" font-size="13">200 OK</text>
      <text x="880" y="185" fill="#94A3B8" font-family="monospace" font-size="13">8ms</text>
    </g>
  </g>
</svg>
