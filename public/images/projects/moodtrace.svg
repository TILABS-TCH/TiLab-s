<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0D13" />
      <stop offset="100%" stop-color="#141722" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1D2A" />
      <stop offset="100%" stop-color="#11131C" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="750" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="750" fill="url(#grid)" rx="16" />

  <!-- App Window Container -->
  <g transform="translate(100, 75)">
    <!-- Window Frame -->
    <rect width="1000" height="600" fill="url(#cardGrad)" rx="12" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    
    <!-- Header Bar -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 988 0 C 994.63 0 1000 5.37 1000 12 L 1000 48 L 0 48 Z" fill="#131520" />
    <circle cx="24" cy="24" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="44" cy="24" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="64" cy="24" r="6" fill="#10B981" opacity="0.8" />
    <rect x="350" y="14" width="300" height="20" rx="10" fill="rgba(255,255,255,0.04)" />
    <text x="500" y="28" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">moodtrace.app/analytics</text>

    <!-- Sidebar -->
    <rect x="0" y="48" width="220" height="552" fill="#0F111A" />
    <rect x="24" y="80" width="172" height="14" rx="4" fill="#00F0FF" opacity="0.8" />
    <rect x="24" y="120" width="120" height="10" rx="3" fill="rgba(255,255,255,0.2)" />
    <rect x="24" y="150" width="140" height="10" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="24" y="180" width="100" height="10" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="24" y="210" width="130" height="10" rx="3" fill="rgba(255,255,255,0.1)" />

    <!-- Main Dashboard Body -->
    <!-- Metric Cards -->
    <g transform="translate(250, 78)">
      <!-- Card 1 -->
      <rect width="220" height="100" rx="8" fill="#161824" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="20" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12">Weekly Mood Index</text>
      <text x="20" y="68" fill="#00F0FF" font-family="sans-serif" font-size="28" font-weight="700">8.4 / 10</text>
      
      <!-- Card 2 -->
      <rect x="240" width="220" height="100" rx="8" fill="#161824" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="260" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12">Reflection Streak</text>
      <text x="260" y="68" fill="#10B981" font-family="sans-serif" font-size="28" font-weight="700">14 Days</text>

      <!-- Card 3 -->
      <rect x="480" width="220" height="100" rx="8" fill="#161824" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="500" y="32" fill="#94A3B8" font-family="sans-serif" font-size="12">Dominant State</text>
      <text x="500" y="68" fill="#F59E0B" font-family="sans-serif" font-size="24" font-weight="700">Focused Calm</text>
    </g>

    <!-- Main Chart Area -->
    <g transform="translate(250, 205)">
      <rect width="700" height="340" rx="10" fill="#141622" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <text x="24" y="36" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600">Emotional Sentiment Spectrum</text>

      <!-- Chart Grid Lines -->
      <line x1="24" y1="80" x2="676" y2="80" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4 4" />
      <line x1="24" y1="150" x2="676" y2="150" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4 4" />
      <line x1="24" y1="220" x2="676" y2="220" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4 4" />
      <line x1="24" y1="290" x2="676" y2="290" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4 4" />

      <!-- Spline Curve -->
      <path d="M 40 250 Q 140 100, 240 180 T 440 120 T 660 80" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" />
      
      <!-- Area Fill -->
      <path d="M 40 250 Q 140 100, 240 180 T 440 120 T 660 80 L 660 300 L 40 300 Z" fill="url(#lineGrad)" opacity="0.08" />

      <!-- Data Dots -->
      <circle cx="40" cy="250" r="6" fill="#00F0FF" />
      <circle cx="240" cy="180" r="6" fill="#10B981" />
      <circle cx="440" cy="120" r="6" fill="#3B82F6" />
      <circle cx="660" cy="80" r="8" fill="#00F0FF" stroke="#FFFFFF" stroke-width="2" />
    </g>
  </g>
</svg>
